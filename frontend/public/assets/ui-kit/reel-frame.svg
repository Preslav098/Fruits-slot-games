      <stop offset=".045" stop-color="#D7993F"/>
      <stop offset=".13" stop-color="#754018"/>
      <stop offset=".5" stop-color="#D99B42"/>
      <stop offset=".87" stop-color="#704019"/>
      <stop offset=".96" stop-color="#E6B75C"/>
