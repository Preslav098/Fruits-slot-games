      <stop offset=".23" stop-color="#FFF0A9"/>
      <stop offset=".39" stop-color="#BA722A"/>
      <stop offset=".58" stop-color="#F8CF70"/>
      <stop offset=".78" stop-color="#A65A22"/>
      <stop offset=".92" stop-color="#F8D67E"/>
