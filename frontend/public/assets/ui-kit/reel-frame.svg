  <g fill="#A36329" stroke="#FCE1A0" stroke-width="1.5">
    <circle cx="162" cy="56" r="3.5"/><circle cx="1148" cy="56" r="3.5"/>
    <circle cx="162" cy="664" r="3.5"/><circle cx="1148" cy="664" r="3.5"/>
    <circle cx="55" cy="149" r="3"/><circle cx="1255" cy="149" r="3"/>
    <circle cx="55" cy="571" r="3"/><circle cx="1255" cy="571" r="3"/>
  </g>
  <g>
    <path d="M655 32L672 46V57L655 70L638 57V46Z" fill="#8A4927" stroke="#FFE49B" stroke-width="1.7"/>
