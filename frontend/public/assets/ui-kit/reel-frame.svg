    <path d="M287 56H468C487 56 491 46 505 46H580C601 46 603 61 624 61" stroke-width="2"/>
    <path d="M1023 56H842C823 56 819 46 805 46H730C709 46 707 61 686 61" stroke-width="2"/>
    <path d="M444 62H488C504 62 509 54 524 54H571 M866 62H822C806 62 801 54 786 54H739" stroke-width="1" opacity=".65"/>
    <path d="M392 51L400 56L392 61L384 56Z M918 51L926 56L918 61L910 56Z" stroke-width="1.5"/>
  </g>

