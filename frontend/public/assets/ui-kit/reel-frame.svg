  <rect x="29" y="29" width="1252" height="662" rx="41" stroke="#FFF1AF" stroke-opacity=".25" stroke-width="2"/>
  <rect x="40" y="40" width="1230" height="640" rx="36" stroke="#5C2A1C" stroke-opacity=".7" stroke-width="2"/>
  <rect x="48" y="48" width="1214" height="624" rx="30" stroke="#C18645" stroke-opacity=".72" stroke-width="1.5"/>
  <rect x="64" y="64" width="1182" height="592" rx="27" stroke="#DB9A55" stroke-opacity=".5" stroke-width="1"/>
